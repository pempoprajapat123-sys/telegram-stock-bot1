name: Daily Stock Report Automation

on:
  schedule:
    # Runs at 13:45 UTC (9:45 AM EST) Monday-Friday
    - cron: '45 13 * * 1-5'
  workflow_dispatch:

jobs:
  run-stock-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests yfinance pandas

      - name: Execute Stock Script
        run: python stock_bot.py
